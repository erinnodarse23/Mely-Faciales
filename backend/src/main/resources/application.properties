spring.application.name=mely-faciales
spring.datasource.url=${MELY_DB_URL}
spring.datasource.username=${MELY_DB_USER}
spring.datasource.password=${MELY_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
mely.media.dir=${MELY_MEDIA_DIR:./media}
