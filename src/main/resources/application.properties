spring.application.name=mely-faciales
spring.datasource.url=${MELY_DB_URL:jdbc:postgresql://localhost:5432/mely_faciales}
spring.datasource.username=${MELY_DB_USER:mely}
spring.datasource.password=${MELY_DB_PASSWORD:mely}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
mely.media.dir=${MELY_MEDIA_DIR:./media}
